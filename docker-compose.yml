services:
  mongo:
    image: mongo:6.0
    container_name: quantg-mongo
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - mongo-data:/data/db
    networks:
      - quantg-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: quantg-backend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    env_file: ./backend/.env
    environment:
      MONGO_URL: mongodb://mongo:27017
      MONGO_URI: mongodb://mongo:27017
      DB_NAME: quantg
      OPTION_LEDGER_PATH: /data/runtime_state.sqlite3
      CORE_ENGINE_ENABLED: "true"
      CORE_ENGINE_PAPER_ENABLED: "true"
      CORE_ENGINE_LIVE_ENABLED: "${CORE_ENGINE_LIVE_ENABLED:-true}"
      LEGACY_EXECUTION_WRITES_ENABLED: "false"
    volumes:
      - backend-state:/data
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - quantg-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_BASE: /api
    container_name: quantg-frontend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      REACT_APP_API_BASE: /api
      NODE_ENV: production
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - quantg-network

  caddy:
    image: caddy:2.8-alpine
    container_name: quantg-caddy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      frontend:
        condition: service_started
    networks:
      - quantg-network

volumes:
  mongo-data:
  backend-state:
  caddy-data:
  caddy-config:

networks:
  quantg-network:
    driver: bridge
