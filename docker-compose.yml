services:
  mongo:
    image: mongo:6.0
    container_name: quantg-mongo
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - mongo-data:/data/db
    networks:
      - quantg-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: quantg-backend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    env_file: ./backend/.env
    environment:
      MONGO_URL: mongodb://mongo:27017
      MONGO_URI: mongodb://mongo:27017
      DB_NAME: quantg
      OPTION_LEDGER_PATH: /data/runtime_state.sqlite3
      CORE_ENGINE_ENABLED: "true"
      CORE_ENGINE_PAPER_ENABLED: "true"
      CORE_ENGINE_LIVE_ENABLED: "${CORE_ENGINE_LIVE_ENABLED:-false}"
      LEGACY_EXECUTION_WRITES_ENABLED: "false"
      # ── Phase 2 options-alpha features (all overridable; defaults match code) ──
      # #4 theta-aware exits (ON): early-exit long option buyers that stall.
      EXIT_THETA_AWARE_ENABLED: "${EXIT_THETA_AWARE_ENABLED:-true}"
      EXIT_THETA_NOPROGRESS_MIN: "${EXIT_THETA_NOPROGRESS_MIN:-8}"
      EXIT_THETA_MIN_PROGRESS_R: "${EXIT_THETA_MIN_PROGRESS_R:-0.3}"
      # #2 delta-based strike selection (ON): pick strike by target delta.
      OPTION_DELTA_SELECTION_ENABLED: "${OPTION_DELTA_SELECTION_ENABLED:-true}"
      # #1 IV-rank gate (OFF → shadow → enabled): block buying expensive premium.
      IV_RANK_GATE_ENABLED: "${IV_RANK_GATE_ENABLED:-false}"
      IV_RANK_GATE_SHADOW: "${IV_RANK_GATE_SHADOW:-false}"
      IV_RANK_BUY_MAX: "${IV_RANK_BUY_MAX:-70}"
      # #3 order-flow gate (OFF → shadow → enabled): need net buying pressure.
      ORDERFLOW_GATE_ENABLED: "${ORDERFLOW_GATE_ENABLED:-false}"
      ORDERFLOW_GATE_SHADOW: "${ORDERFLOW_GATE_SHADOW:-false}"
      ORDERFLOW_MIN_IMBALANCE: "${ORDERFLOW_MIN_IMBALANCE:-0.15}"
      # #5 defined-risk credit spreads (OFF): per-strategy opt-in via structure.
      CREDIT_SPREADS_ENABLED: "${CREDIT_SPREADS_ENABLED:-false}"
      CREDIT_SPREAD_SHORT_DELTA: "${CREDIT_SPREAD_SHORT_DELTA:-0.30}"
      CREDIT_SPREAD_WIDTH_STRIKES: "${CREDIT_SPREAD_WIDTH_STRIKES:-2}"
    volumes:
      - backend-state:/data
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - quantg-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_BASE: /api
    container_name: quantg-frontend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      REACT_APP_API_BASE: /api
      NODE_ENV: production
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - quantg-network

  caddy:
    image: caddy:2.8-alpine
    container_name: quantg-caddy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      frontend:
        condition: service_started
    networks:
      - quantg-network

volumes:
  mongo-data:
  backend-state:
  caddy-data:
  caddy-config:

networks:
  quantg-network:
    driver: bridge
