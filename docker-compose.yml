services:
  mongo:
    image: mongo:6.0
    container_name: quantg-mongo
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - mongo-data:/data/db
    networks:
      - quantg-network
    healthcheck:
      # timeout raised 5s→20s + start_period added: mongosh COLD-START alone can
      # exceed 5s under load even though mongod answers instantly, which falsely
      # marked the container "unhealthy" and blocked `up -d backend` (depends_on
      # service_healthy). Loosened so a slow probe can't false-trip it.
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 20s
      retries: 5
      start_period: 60s

  backend:
    build: ./backend
    container_name: quantg-backend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    env_file: ./backend/.env
    environment:
      MONGO_URL: mongodb://mongo:27017
      MONGO_URI: mongodb://mongo:27017
      DB_NAME: quantg
      OPTION_LEDGER_PATH: /data/runtime_state.sqlite3
      CORE_ENGINE_ENABLED: "true"
      CORE_ENGINE_PAPER_ENABLED: "true"
      CORE_ENGINE_LIVE_ENABLED: "${CORE_ENGINE_LIVE_ENABLED:-false}"
      LEGACY_EXECUTION_WRITES_ENABLED: "false"
      # ── Phase 2 options-alpha features (all overridable; defaults match code) ──
      # #4 theta-aware exits (ON): early-exit long option buyers that stall.
      EXIT_THETA_AWARE_ENABLED: "${EXIT_THETA_AWARE_ENABLED:-true}"
      EXIT_THETA_NOPROGRESS_MIN: "${EXIT_THETA_NOPROGRESS_MIN:-8}"
      EXIT_THETA_MIN_PROGRESS_R: "${EXIT_THETA_MIN_PROGRESS_R:-0.3}"
      # Theta entry guard: skip option-BUYS when underlying intraday ATR% is below
      # this floor (not enough expected movement to overcome theta). Lowered from the
      # code default 0.08 to 0.05 on 2026-06-19 so the book still trades on quiet,
      # low-vol days (today's NIFTY/BANKNIFTY ATR% ran 0.054–0.079, just under 0.08,
      # which blocked ~40+ signals). Revert to 0.08 to restore the stricter floor.
      EXIT_THETA_GUARD_ATR_PCT: "${EXIT_THETA_GUARD_ATR_PCT:-0.05}"
      # #2 delta-based strike selection (ON): pick strike by target delta.
      OPTION_DELTA_SELECTION_ENABLED: "${OPTION_DELTA_SELECTION_ENABLED:-true}"
      # #1 IV-rank gate (ON): block option BUYS only when IV is richly priced
      # (top 30% of its range). Lenient by design + no-ops until VIX history
      # builds, so it trims expensive entries without starving trade frequency.
      IV_RANK_GATE_ENABLED: "${IV_RANK_GATE_ENABLED:-true}"
      IV_RANK_GATE_SHADOW: "${IV_RANK_GATE_SHADOW:-false}"
      IV_RANK_BUY_MAX: "${IV_RANK_BUY_MAX:-75}"
      # #3 order-flow gate (ON): require mild net buying pressure for a BUY.
      # No book data never blocks, so it only filters clearly-adverse entries.
      ORDERFLOW_GATE_ENABLED: "${ORDERFLOW_GATE_ENABLED:-true}"
      ORDERFLOW_GATE_SHADOW: "${ORDERFLOW_GATE_SHADOW:-false}"
      ORDERFLOW_MIN_IMBALANCE: "${ORDERFLOW_MIN_IMBALANCE:-0.15}"
      # #5 defined-risk credit spreads (option SELLING — theta-positive, fires in
      # low-vol where buyers can't). DISABLED 2026-06-17 after a double-execution
      # phantom (synthetic "<UND>-bullish-spread" routed through the generic
      # fill->PortfolioLedger path as a phantom EQUITY position, bled -16.5k).
      # RE-ENABLED 2026-06-18: precondition met — commit 7e2921a Guard 1 rejects any
      # NSE_FO/BSE_FO order lacking a pipe broker instrument_key, so the synthetic
      # spread label can no longer reach the generic path; spread router returns
      # early (signal_manager:743, no fall-through); Stages 3/4 fixed spread P&L;
      # strategy_runner exempts credit_spread from the theta guard. Paper only.
      CREDIT_SPREADS_ENABLED: "${CREDIT_SPREADS_ENABLED:-true}"
      # WR-31 (2026-07-01): short strike 0.30 -> 0.20 delta → POP ~70% -> ~80%.
      # Trades less premium for a higher win rate. Reversible: set back to 0.30.
      CREDIT_SPREAD_SHORT_DELTA: "${CREDIT_SPREAD_SHORT_DELTA:-0.20}"
      CREDIT_SPREAD_WIDTH_STRIKES: "${CREDIT_SPREAD_WIDTH_STRIKES:-2}"
      CREDIT_SPREAD_SL_MULT: "${CREDIT_SPREAD_SL_MULT:-2.0}"
      CREDIT_ENTRY_WINDOW: "${CREDIT_ENTRY_WINDOW:-0945-1500}"
      BANKNIFTY_THETA_EXPIRY_WEEK_ONLY: "${BANKNIFTY_THETA_EXPIRY_WEEK_ONLY:-true}"
      EQUITY_MIN_REQUIRED_CAPITAL: "${EQUITY_MIN_REQUIRED_CAPITAL:-50000}"
      EQUITY_ENTRY_CUTOFF: "${EQUITY_ENTRY_CUTOFF:-1430}"
      # Debit spreads (defined-risk option BUYING) — engine fully supports them;
      # NIFTY/BANKNIFTY directional buyers opt in via structure=debit_spread.
      DEBIT_SPREADS_ENABLED: "${DEBIT_SPREADS_ENABLED:-true}"
      # 0.50→0.65: ITM long leg (less theta, higher win rate) for directional
      # debit-spread buyers — WR-22. Reversible via env.
      DEBIT_SPREAD_LONG_DELTA: "${DEBIT_SPREAD_LONG_DELTA:-0.65}"
    volumes:
      - backend-state:/data
      - ./.git:/app/.git:ro
      - ./wiki:/app/wiki
      # Free EOD bhavcopy stores for the OOS backtester: bhavcopy_fo (index F&O) +
      # bhavcopy_cm (NSE equity EOD, EDR-05). Writable so the daily ingest cron
      # (scripts/bhavcopy_ingest.py, run via docker exec) keeps them fresh and
      # they persist across container restarts.
      - ./data:/app/data
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - quantg-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_BASE: /api
    container_name: quantg-frontend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      REACT_APP_API_BASE: /api
      NODE_ENV: production
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - quantg-network

  caddy:
    image: caddy:2.8-alpine
    container_name: quantg-caddy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      frontend:
        condition: service_started
    networks:
      - quantg-network

  hermes:
    build: ./hermes
    container_name: quantg-hermes
    restart: unless-stopped
    env_file: .env.hermes
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - quantg-network

volumes:
  mongo-data:
  backend-state:
  caddy-data:
  caddy-config:

networks:
  quantg-network:
    driver: bridge
